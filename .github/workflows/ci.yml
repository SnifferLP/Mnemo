name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck
      - name: Frontend tests
        run: pnpm test
      - name: Production frontend build
        run: pnpm build

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    # A stalled apt mirror or a hung test fails the job instead of occupying a
    # runner until GitHub's six-hour default timeout.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Same probed-mirror installation as build-linux.yml; see
      # scripts/ci/install-linux-deps.sh.
      - name: Install Linux dependencies
        timeout-minutes: 5
        run: bash scripts/ci/install-linux-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets

  windows:
    name: Windows checks and installer
    uses: ./.github/workflows/build-windows.yml

  linux-bundles:
    name: Linux package bundles
    uses: ./.github/workflows/build-linux.yml

  arch-package:
    name: Arch package
    uses: ./.github/workflows/build-arch.yml

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
