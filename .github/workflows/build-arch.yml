name: Build Arch package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git nodejs npm rust \
            webkit2gtk-4.1 gtk3 libsoup3 hicolor-icon-theme \
            pkgconf patchelf librsvg
          useradd -m builder
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm@12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build release binary
        run: pnpm tauri build --no-bundle
      - name: Build Arch package
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su - builder -c "cd '$GITHUB_WORKSPACE' && ./packaging/arch/build-binary-package.sh"
      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: mnemo-arch-package
          if-no-files-found: error
          path: packaging/arch/mnemo-[0-9]*-1-x86_64.pkg.tar.zst
