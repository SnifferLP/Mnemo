name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach artifacts to, for example v1.2.4
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      sign_updates: true
      ref: ${{ inputs.tag || github.event.release.tag_name }}
    secrets: inherit

  linux:
    uses: ./.github/workflows/build-linux.yml
    with:
      sign_updates: true
      ref: ${{ inputs.tag || github.event.release.tag_name }}
    secrets: inherit

  arch:
    uses: ./.github/workflows/build-arch.yml
    with:
      ref: ${{ inputs.tag || github.event.release.tag_name }}

  source:
    name: Source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Create source archive
        run: ./packaging/arch/make-source-archive.sh
      - name: Verify Arch source checksum
        run: |
          version="$(node -p "require('./package.json').version")"
          archive="packaging/arch/mnemo-${version}.tar.gz"
          actual="$(sha256sum "$archive" | cut -d' ' -f1)"
          expected="$(sed -n "s/^sha256sums=('\([0-9a-f]\{64\}\)')$/\1/p" packaging/arch/PKGBUILD)"
          if [ -z "$expected" ]; then
            echo "error: packaging/arch/PKGBUILD does not pin a source archive checksum" >&2
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "error: source archive checksum $actual does not match PKGBUILD $expected" >&2
            exit 1
          fi

      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: mnemo-source-archive
          if-no-files-found: error
          path: packaging/arch/mnemo-*.tar.gz

  publish:
    name: Publish release assets
    needs: [windows, linux, arch, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mnemo-*
          path: release
          merge-multiple: true

      # A release-triggered run carries the tag in the event payload; a manual
      # recovery run passes it as an input. Everything downstream reads the
      # resolved values, including the release's own pre-release flag, so a
      # recovery never changes the state of the existing release.
      - name: Resolve the target release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks out the repository, so gh needs the repo spelled
          # out instead of inferring it from a remote.
          GH_REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$EVENT_TAG}"
          if [ -z "$tag" ]; then
            echo "error: no target tag. Pass the tag input when running this workflow manually." >&2
            exit 1
          fi
          if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "error: release $tag does not exist. This workflow only attaches assets to an existing release; it never creates tags or releases." >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release view "$tag" --json isPrerelease --jq '"RELEASE_PRERELEASE=\(.isPrerelease)"' >> "$GITHUB_ENV"
          gh release view "$tag" --json publishedAt --jq '"RELEASE_PUBLISHED_AT=\(.publishedAt)"' >> "$GITHUB_ENV"
          gh release view "$tag" --json body --jq .body > "$RUNNER_TEMP/release-body.md"
          echo "Attaching artifacts to existing release $tag"

      - name: Generate updater manifest
        env:
          RELEASE_TAG: ${{ env.TAG }}
          PUBLISHED_AT: ${{ env.RELEASE_PUBLISHED_AT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          windows_name="Mnemo_${version}_x64-setup.exe"
          linux_name="Mnemo_${version}_amd64.AppImage"
          windows_file="$(find release -type f -name "$windows_name" -print -quit)"
          linux_file="$(find release -type f -name "$linux_name" -print -quit)"
          windows_sig="$(find release -type f -name "${windows_name}.sig" -print -quit)"
          linux_sig="$(find release -type f -name "${linux_name}.sig" -print -quit)"

          if [ -z "$windows_file" ] || [ -z "$linux_file" ]; then
            echo "error: expected Windows and Linux updater artifacts are missing." >&2
            exit 1
          fi
          if [ -z "$windows_sig" ] || [ -z "$linux_sig" ]; then
            echo "error: updater signatures are missing; refusing to publish a manifest that cannot be verified." >&2
            exit 1
          fi

          jq -n \
            --arg version "$version" \
            --rawfile notes "$RUNNER_TEMP/release-body.md" \
            --arg pub_date "$PUBLISHED_AT" \
            --arg windows_url "https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${windows_name}" \
            --arg windows_signature "$(cat "$windows_sig")" \
            --arg linux_url "https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${linux_name}" \
            --arg linux_signature "$(cat "$linux_sig")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { url: $windows_url, signature: $windows_signature },
                "linux-x86_64": { url: $linux_url, signature: $linux_signature }
              }
            }' > release/latest.json
          cat release/latest.json

      - name: Generate SHA-256 checksums
        run: |
          (
            cd release
            find . -type f -not -name SHA256SUMS -print0 \
              | sort -z \
              | while IFS= read -r -d '' file; do
                  printf '%s  %s\n' "$(sha256sum "$file" | cut -d' ' -f1)" "$(basename "$file")"
                done
          ) > release/SHA256SUMS
          cat release/SHA256SUMS

      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ env.RELEASE_PRERELEASE == 'true' }}
          files: release/**/*
          fail_on_unmatched_files: true
          generate_release_notes: false
