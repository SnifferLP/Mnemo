name: Build Linux bundles

on:
  workflow_call:
    inputs:
      sign_updates:
        description: Build signed updater artifacts
        required: false
        type: boolean
        default: false
      ref:
        description: Git ref (usually a release tag) to build; empty uses the triggering ref
        required: false
        type: string
        default: ""
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux AppImage and Debian package
    runs-on: ubuntu-24.04
    # A stuck apt or a stalled bundle must fail the release instead of
    # occupying a runner until GitHub's six-hour default timeout.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The hosted image resolves apt through mirror+file:/etc/apt/apt-mirrors.txt,
      # which points at azure.archive.ubuntu.com. That resolver fails
      # intermittently ("Temporary failure resolving ..."), and apt then walks a
      # 181 package list one download timeout at a time for ~50 minutes. This
      # step replaces the routing with one explicitly probed mirror, validates
      # the indexes, and fails within five minutes with a diagnostic instead.
      - name: Install Linux build dependencies
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          echo "::group::Runner apt configuration"
          echo "--- /etc/apt/apt-mirrors.txt"
          cat /etc/apt/apt-mirrors.txt || true
          echo "--- /etc/apt/sources.list"
          cat /etc/apt/sources.list || true
          echo "--- /etc/apt/sources.list.d"
          grep -R . /etc/apt/sources.list.d/ || true
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            echo "--- getent ahosts ${host}"
            getent ahosts "$host" || echo "unresolved"
          done
          echo "--- resolv.conf"
          cat /etc/resolv.conf || true
          echo "::endgroup::"

          # Only HTTPS mirrors that carry all four noble suites are candidates.
          candidates=(
            "https://archive.ubuntu.com/ubuntu"
            "https://mirrors.edge.kernel.org/ubuntu"
            "https://ftp.osuosl.org/pub/ubuntu"
            "https://mirror.math.princeton.edu/pub/ubuntu"
          )
          suites=(noble noble-updates noble-backports noble-security)

          chosen=""
          for mirror in "${candidates[@]}"; do
            host="${mirror#*://}"
            host="${host%%/*}"
            if ! getent ahosts "$host" >/dev/null 2>&1; then
              echo "DNS failure: $host does not resolve" >&2
              continue
            fi
            reachable=1
            for suite in "${suites[@]}"; do
              if ! curl -fsSI --max-time 8 "$mirror/dists/${suite}/Release" >/dev/null 2>&1; then
                echo "Unresponsive: ${mirror}/dists/${suite}" >&2
                reachable=0
                break
              fi
            done
            if [ "$reachable" -eq 1 ]; then
              echo "Selected mirror: $mirror"
              chosen="$mirror"
              break
            fi
          done

          if [ -z "$chosen" ]; then
            echo "error: no apt mirror answered for noble, noble-updates, noble-backports and noble-security." >&2
            echo "This runner cannot install Linux build dependencies; refusing to attempt 181 downloads." >&2
            for mirror in "${candidates[@]}"; do
              host="${mirror#*://}"
              host="${host%%/*}"
              if getent ahosts "$host" >/dev/null 2>&1; then
                echo "  $host resolves but does not serve the noble suites over HTTP(S)" >&2
              else
                echo "  $host does not resolve" >&2
              fi
            done
            exit 1
          fi

          # Drop mirror+file routing and unrelated third-party lists so the update
          # is deterministic and a single failing repository is fatal.
          sudo mkdir -p /etc/apt/sources.list.d.disabled
          for file in /etc/apt/sources.list.d/*; do
            [ -e "$file" ] || continue
            sudo mv "$file" /etc/apt/sources.list.d.disabled/
          done
          sudo rm -f /etc/apt/sources.list
          printf 'deb %s noble main restricted universe multiverse\ndeb %s noble-updates main restricted universe multiverse\ndeb %s noble-backports main restricted universe multiverse\ndeb %s noble-security main restricted universe multiverse\n' \
            "$chosen" "$chosen" "$chosen" "$chosen" | sudo tee /etc/apt/sources.list >/dev/null
          echo "--- effective sources"
          cat /etc/apt/sources.list

          apt_options=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=10
            -o Acquire::https::Timeout=10
            -o Acquire::ForceIPv4=true
            -o DPkg::Lock::Timeout=60
          )

          started=$SECONDS
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update

          # Validate the indexes before downloading a single package.
          if ! find /var/lib/apt/lists -name '*noble*Packages*' -print -quit | grep -q .; then
            echo "error: apt update produced no noble package index from $chosen." >&2
            exit 1
          fi
          for package in libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev patchelf; do
            if ! apt-cache policy "$package" | grep -q 'Candidate: [0-9]'; then
              echo "error: $package is not available from $chosen." >&2
              apt-cache policy "$package" >&2
              exit 1
            fi
          done

          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

          for package in libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev patchelf; do
            if ! dpkg -s "$package" >/dev/null 2>&1; then
              echo "error: $package is still missing after installation." >&2
              exit 1
            fi
          done
          echo "Linux build dependencies installed from $chosen in $((SECONDS - started))s"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Verify updater signing secrets
        if: ${{ inputs.sign_updates }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "error: signed updater builds require TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets." >&2
            exit 1
          fi
      - name: Build AppImage and Debian package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.sign_updates }}" = "true" ]; then
            pnpm tauri build --config src-tauri/tauri.release.conf.json
          else
            pnpm tauri build
          fi
      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: mnemo-linux-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
