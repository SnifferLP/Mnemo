name: Build Linux bundles

on:
  workflow_call:
    inputs:
      sign_updates:
        description: Build signed updater artifacts
        required: false
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux AppImage and Debian package
    runs-on: ubuntu-24.04
    # A stuck apt or a stalled bundle must fail the release instead of
    # occupying a runner until GitHub's six-hour default timeout.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux build dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The runner image points apt at an Azure mirror that can be
          # unreachable; without bounded timeouts and retries apt falls back to
          # per-package 40 second waits and the job appears to hang.
          apt_options=(
            -o Acquire::Retries=5
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o Acquire::ForceIPv4=true
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" -o DPkg::Lock::Timeout=120 install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Verify updater signing secrets
        if: ${{ inputs.sign_updates }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "error: signed updater builds require TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets." >&2
            exit 1
          fi
      - name: Build AppImage and Debian package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.sign_updates }}" = "true" ]; then
            pnpm tauri build --config src-tauri/tauri.release.conf.json
          else
            pnpm tauri build
          fi
      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: mnemo-linux-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
