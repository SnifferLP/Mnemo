name: Build Linux bundles

on:
  workflow_call:
    inputs:
      sign_updates:
        description: Build signed updater artifacts
        required: false
        type: boolean
        default: false
      ref:
        description: Git ref (usually a release tag) to build; empty uses the triggering ref
        required: false
        type: string
        default: ""
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    # A stuck apt or a stalled bundle must fail the release instead of
    # occupying a runner until GitHub's six-hour default timeout.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Shared with ci.yml. The hosted image resolves apt through
      # mirror+file:/etc/apt/apt-mirrors.txt, which points at
      # azure.archive.ubuntu.com. That resolver fails intermittently
      # ("Temporary failure resolving ..."), and apt then walks a 181 package
      # list one download timeout at a time for ~50 minutes. The script probes
      # an explicit mirror, validates the indexes, and fails within five
      # minutes with a diagnostic instead.
      - name: Install Linux build dependencies
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: bash scripts/ci/install-linux-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Verify updater signing secrets
        if: ${{ inputs.sign_updates }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "error: signed updater builds require TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets." >&2
            exit 1
          fi
      - name: Build AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.sign_updates }}" = "true" ]; then
            pnpm tauri build --bundles appimage --config src-tauri/tauri.release.conf.json
          else
            pnpm tauri build --bundles appimage
          fi
      - name: Upload Linux bundles
        uses: actions/upload-artifact@v7
        with:
          name: mnemo-linux-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
