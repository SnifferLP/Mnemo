name: Bug report
description: Report a reproducible problem in Mnemo.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Mnemo. Remove API keys, `secure.key`, database files, personal study content and machine-specific paths before posting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mnemo version
      placeholder: "1.2.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform and package
      options:
        - Linux — Arch package
        - Linux — AppImage
        - Linux — Debian package
        - Linux — source build
        - Windows — NSIS installer
        - Windows — source build
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets, private study content and absolute home-directory paths.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is reproducible on a current version.
          required: true
        - label: This report contains no API keys, credentials, private study content or personal information.
          required: true
