[package]
name = "mnemo"
version = "1.2.5-rc.3"
description = "Local-first desktop study platform with flashcards and spaced repetition"
authors = ["Mnemo contributors"]
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.90"

[lib]
name = "mnemo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
getrandom = "0.3.4"
pdf-extract = "0.12.1"
quick-xml = "0.39.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
semver = "1.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
zip = "4.2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
] }
